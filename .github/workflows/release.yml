name: Release
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Plugin zip for {0}', github.ref_name) }}

# On a version tag (v0.1.0), build the plugin zip and publish a GitHub release with it.
# Sites with the plugin then see the update in Dashboard → Updates (from the GitHub updater).
# On pull requests, just build the zip so it can be downloaded and tried.
on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  zip:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Build zip
        id: build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bash .github/scripts/build-zip.sh "${GITHUB_REF_NAME#v}"
          else
            bash .github/scripts/build-zip.sh
          fi

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}
          if-no-files-found: error

      - name: Upload EventPrime migrator zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.addon_name }}
          path: ${{ steps.build.outputs.addon_zip }}
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Build zip
        id: build
        run: bash .github/scripts/build-zip.sh "${GITHUB_REF_NAME#v}"

      - name: Create release with the zip
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.addon_zip }}" --title "Lumaha Simple Event Tickets ${{ steps.build.outputs.version }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
